name: Branding CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_om_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_om_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_om_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_om_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      PLATFORM_ADMIN_EMAIL: admin@example.test
      PLATFORM_ADMIN_PASSWORD: ci-only-password-long-enough
      PLATFORM_ADMIN_NAME: CI Platform Administrator
      E2E_TENANT_ADMIN_EMAIL: e2e-owner@example.test
      E2E_TENANT_ADMIN_PASSWORD: ci-e2e-owner-password-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run db:generate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run audit:branding
      - run: npm test
      - run: npm run build
      - name: Install Chromium for live browser verification
        run: npx playwright install --with-deps chromium
      - name: Start built application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/crm-om-next.log 2>&1 &
          echo $! > /tmp/crm-om-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/crm-om-next.log
          exit 1
      - name: Verify branding updates without restarting the application
        run: npm run test:e2e
      - name: Print server output on failure
        if: failure()
        run: cat /tmp/crm-om-next.log || true
