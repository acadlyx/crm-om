name: Customer Load Simulation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/v1/crm/**"
      - "lib/**"
      - "prisma/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/customer-load-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_om_load_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_om_load_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_om_load_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-only-load-test-secret-not-used-in-production
      PLATFORM_ADMIN_EMAIL: ci-platform-admin@example.test
      PLATFORM_ADMIN_PASSWORD: CI-Only-Platform-Password-2026!
      LOAD_TEST_EMAIL: loadtest.admin@example.test
      LOAD_TEST_PASSWORD: Load-Test-Only-Password-2026!
      LOAD_TEST_COUNT: "1000"
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply schema and generate Prisma Client
        run: npm run db:migrate && npm run db:generate
      - name: Seed isolated database
        run: npm run db:seed && npx tsx scripts/create-load-test-tenant.ts
      - name: Build application
        run: npm run build
      - name: Start built application
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/crm-om-load-test-server.log 2>&1 &
          echo $! > /tmp/crm-om-load-test-server.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/auth/csrf > /dev/null; then
              echo "Built application is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/crm-om-load-test-server.log
          exit 1
      - name: Simulate 1,000 concurrent customer creates, reads, and cleanup
        run: node scripts/stress-test-customers.mjs
      - name: Upload workload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-load-simulation-report
          path: artifacts/customer-load-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/crm-om-load-test-server.log || true
